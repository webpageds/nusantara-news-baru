name: Refresh NusantaraNews headlines

on:
  schedule:
    - cron: "19 */3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "article.html"
      - "index.html"
      - "admin/index.html"
      - "admin/config.js"
      - "supabase/functions/article-share/**"
      - "data/news.json"
      - "scripts/update_news.py"
      - "scripts/build_article_pages.py"

permissions:
  contents: write

concurrency:
  group: refresh-nusantara-news
  cancel-in-progress: false

jobs:
  refresh-news-and-social-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import recent public headlines
        run: python scripts/update_news.py
      - name: Generate per-article HTML and sitemap
        run: python scripts/build_article_pages.py
      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json artikel sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Refresh headlines and article share previews"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then
                  exit 0
                fi
              else
                git rebase --abort || true
              fi
              echo "Push attempt $attempt conflicted with a concurrent update; retrying."
              sleep 2
            done
            echo "Could not publish generated pages after 3 attempts." >&2
            exit 1
          fi
