name: Refresh NusantaraNews headlines

on:
  schedule:
    - cron: "19 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "article.html"
      - "scripts/update_news.py"
      - "scripts/build_article_pages.py"

permissions:
  contents: write

concurrency:
  group: refresh-nusantara-news
  cancel-in-progress: false

jobs:
  refresh-news-and-social-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import recent public headlines
        run: python scripts/update_news.py
      - name: Generate per-article HTML and sitemap
        run: python scripts/build_article_pages.py
      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json artikel sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Refresh headlines and article share previews"
            git push origin main
          fi
